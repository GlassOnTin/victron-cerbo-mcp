[project]
name = "victron-cerbo-mcp"
version = "0.1.0"
description = "MCP server exposing a Victron Cerbo GX (and connected MultiPlus / MPPT) over local MQTT, with reads and bounded writes."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.2",
    "victron-mqtt>=2026.4.19",
    "pydantic>=2.7",
]

[project.scripts]
victron-cerbo-mcp = "victron_cerbo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/victron_cerbo_mcp"]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
